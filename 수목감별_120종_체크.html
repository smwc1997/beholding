<div id="app">
  <header class="top">
    <div class="counts">
      <span class="big" id="ckCount">0</span>
      <span class="of">/ 120 확인</span>
      <span class="known" id="knCount">익숙함 0</span>
    </div>
    <div class="bar"><i id="barFill"></i></div>
  </header>

  <nav class="modes">
    <button class="mode on" data-mode="list">목록</button>
    <button class="mode" data-mode="card">이름 익히기</button>
  </nav>

  <section id="listView">
    <div class="chips" id="chips"></div>
    <ul id="rows"></ul>
  </section>

  <section id="cardView" hidden>
    <div class="card">
      <div class="num" id="cNum"></div>
      <div class="name" id="cName"></div>
      <div class="hint" id="cHint" hidden></div>
      <button class="reveal" id="reveal">단서 보기</button>
      <div class="judge" hidden id="judge">
        <button class="again" id="again">다시</button>
        <button class="got" id="got">익숙함</button>
      </div>
    </div>
    <button class="reset-known" id="resetKnown">익숙함 기록 지우기</button>
  </section>
</div>

<style>
  #app{
    --paper:#F5F6F1; --ink:#16241C; --moss:#5C7A63;
    --berry:#A63325; --line:#DCE0D5; --chip:#E8EBE2;
    background:var(--paper); color:var(--ink);
    font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
    max-width:760px; margin:0 auto; padding:0 0 48px;
    -webkit-text-size-adjust:100%;
  }
  #app *{box-sizing:border-box}
  #app button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
  #app button:focus-visible{outline:2px solid var(--berry);outline-offset:2px}

  .top{padding:20px 18px 14px;position:sticky;top:0;background:var(--paper);z-index:5;border-bottom:1px solid var(--line)}
  .counts{display:flex;align-items:baseline;gap:8px}
  .big{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1}
  .of{font-size:15px;color:var(--moss)}
  .known{margin-left:auto;font-size:14px;color:var(--moss)}
  .bar{height:5px;background:var(--chip);border-radius:3px;margin-top:12px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--berry);transition:width .25s}

  .modes{display:flex;gap:0;border-bottom:1px solid var(--line)}
  .mode{flex:1;padding:14px 0;font-size:16px;color:var(--moss);border-bottom:2px solid transparent}
  .mode.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}

  .chips{display:flex;gap:7px;overflow-x:auto;padding:14px 18px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:9px 15px;border-radius:20px;background:var(--chip);font-size:15px;color:var(--moss);white-space:nowrap}
  .chip.on{background:var(--ink);color:var(--paper)}

  #rows{list-style:none;margin:0;padding:0}
  #rows li{display:flex;align-items:flex-start;gap:14px;padding:13px 18px;border-bottom:1px solid var(--line);min-height:60px}
  .tick{flex:0 0 auto;width:30px;height:30px;border:2px solid var(--line);border-radius:50%;margin-top:2px;position:relative}
  .tick.on{background:var(--berry);border-color:var(--berry)}
  .tick.on::after{content:"";position:absolute;left:9px;top:4px;width:7px;height:13px;border:solid var(--paper);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
  .body{flex:1;min-width:0;text-align:left}
  .nm{font-size:19px;font-weight:600;letter-spacing:-.01em}
  .no{font-size:13px;color:var(--moss);font-weight:400;margin-left:7px}
  .ht{font-size:14.5px;color:var(--moss);line-height:1.5;margin-top:3px}
  li.done .nm{color:var(--moss)}

  .card{margin:28px 18px;padding:34px 22px;border:1px solid var(--line);border-radius:4px;background:#fff;text-align:center}
  .num{display:none}
  .name{font-size:38px;font-weight:700;letter-spacing:-.02em;margin:0 0 22px;line-height:1.2}
  .hint{font-size:17px;color:var(--moss);line-height:1.6;margin-bottom:22px;text-align:left}
  .reveal{width:100%;padding:16px;border:1px solid var(--ink);border-radius:3px;font-size:17px}
  .judge{display:flex;gap:10px}
  .judge button{flex:1;padding:16px;border-radius:3px;font-size:17px}
  .again{border:1px solid var(--line);color:var(--moss)}
  .got{background:var(--ink);color:var(--paper)}
  .reset-known{display:block;margin:0 auto;padding:10px;font-size:14px;color:var(--moss);text-decoration:underline}

  @media (prefers-reduced-motion:reduce){#app *{transition:none!important}}
</style>

   [107,"팽나무","","잎 상반부에만 톱니, 밑이 좌우 비대칭, 수피 매끈 회색"],
   [108,"풍년화","한방","노란 실오라기 같은 꽃잎, 이른 봄"],
   [109,"피나무","","하트형 비대칭 잎, 열매자루에 주걱 모양 포"],
   [110,"피라칸타","","가시 있는 관목, 주황빛 열매가 뭉쳐 달림"],
   [111,"해당화","","줄기에 가시가 빽빽, 잎에 주름, 바닷가"],
   [112,"향나무","침엽","바늘잎과 비늘잎이 한 나무에 섞여 남"],
   [113,"호두나무","복엽","우상복엽, 잎이 크고 두꺼우며 향이 남"],
   [114,"호랑가시나무","한방","잎에 날카로운 가시, 붉은 열매"],
   [115,"화살나무","마주·한방","줄기에 코르크 날개가 세로로 붙음"],
   [116,"회양목","마주","아주 작고 두꺼운 상록 잎이 마주나기"],
   [117,"회화나무","복엽","우상복엽, 가시 없음, 가지가 초록빛"],
   [118,"후박나무","상록","두껍고 광택 있는 잎이 가지 끝에 모여남"],
   [119,"흰말채나무","마주","겨울 줄기가 선명한 붉은색, 흰 열매"],
   [120,"히어리","한방","노란 꽃이 포도송이처럼 아래로 늘어짐"]
  ];

  var KEY="sumok120:v1", S={ck:{},kn:{}}, filter="전체", mode="list", cur=null, shown=false;
  var FILTERS=["전체","미확인","침엽","마주","복엽","참나무","상록","덩굴","한방"];

  var $=function(i){return document.getElementById(i)};

  function load(){
    try{
      window.storage.get(KEY).then(function(r){
        if(r&&r.value){var p=JSON.parse(r.value);S.ck=p.ck||{};S.kn=p.kn||{}}
        render();
      }).catch(function(){render()});
    }catch(e){render()}
  }
  var t=null;
  function save(){
    clearTimeout(t);
    t=setTimeout(function(){
      try{window.storage.set(KEY,JSON.stringify(S)).catch(function(){})}catch(e){}
    },250);
  }

  function match(d){
    if(filter==="전체")return true;
    if(filter==="미확인")return !S.ck[d[0]];
    return (d[2]||"").indexOf(filter)>-1;
  }

  function renderChips(){
    $("chips").innerHTML=FILTERS.map(function(f){
      return '<button class="chip'+(f===filter?' on':'')+'" data-f="'+f+'">'+f+'</button>';
    }).join("");
  }

  function renderRows(){
    var list=D.filter(match);
    $("rows").innerHTML=list.map(function(d){
      var on=S.ck[d[0]];
      return '<li class="'+(on?'done':'')+'" data-n="'+d[0]+'">'+
        '<button class="tick'+(on?' on':'')+'" aria-label="확인 표시"></button>'+
        '<div class="body"><div class="nm">'+d[1]+'<span class="no">'+d[0]+'</span></div>'+
        '<div class="ht">'+d[3]+'</div></div></li>';
    }).join("");
  }

  function renderHead(){
    var c=Object.keys(S.ck).length, k=Object.keys(S.kn).length;
    $("ckCount").textContent=c;
    $("knCount").textContent="익숙함 "+k;
    $("barFill").style.width=(c/120*100)+"%";
  }

  function render(){renderHead();renderChips();renderRows();}

  function pick(){
    var pool=D.filter(function(d){return !S.kn[d[0]]});
    if(!pool.length)pool=D;
    return pool[Math.floor(Math.random()*pool.length)];
  }
  function drawCard(){
    cur=pick();shown=false;
    $("cNum").textContent="";
    $("cName").textContent=cur[1];
    $("cHint").textContent=(cur[2]?cur[2]+" · ":"")+cur[3];
    $("cHint").hidden=true;$("judge").hidden=true;$("reveal").hidden=false;
  }

  document.addEventListener("click",function(e){
    var c=e.target.closest(".chip");
    if(c){filter=c.dataset.f;renderChips();renderRows();return}

    var tk=e.target.closest(".tick");
    if(tk){
      var n=tk.closest("li").dataset.n;
      if(S.ck[n])delete S.ck[n];else S.ck[n]=1;
      save();renderHead();
      if(filter==="미확인")renderRows();
      else{var li=tk.closest("li");li.classList.toggle("done");tk.classList.toggle("on")}
      return;
    }

    var m=e.target.closest(".mode");
    if(m){
      mode=m.dataset.mode;
      document.querySelectorAll(".mode").forEach(function(b){b.classList.toggle("on",b===m)});
      $("listView").hidden=mode!=="list";
      $("cardView").hidden=mode!=="card";
      if(mode==="card")drawCard();else render();
      return;
    }

    if(e.target.id==="reveal"){
      $("cHint").hidden=false;$("reveal").hidden=true;$("judge").hidden=false;shown=true;return;
    }
    if(e.target.id==="got"){S.kn[cur[0]]=1;save();renderHead();drawCard();return}
    if(e.target.id==="again"){delete S.kn[cur[0]];save();renderHead();drawCard();return}
    if(e.target.id==="resetKnown"){S.kn={};save();renderHead();drawCard();return}
  });

  load();
})();
</script>
